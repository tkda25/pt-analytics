<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PT Analytics MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🏋️ <span>PT Analytics</span></div>
      <nav>
        <button class="nav-item active">ダッシュボード</button>
        <button class="nav-item">クライアント</button>
        <button class="nav-item">トレーニング</button>
        <button class="nav-item">身体データ</button>
        <button class="nav-item">生活・コンディション</button>
        <button class="nav-item">レポート</button>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">クライアント詳細</p>
          <h1 id="clientTitle">山田 太郎</h1>
        </div>
        <div class="top-actions"><button id="clientBtn" class="ghost-btn">クライアント管理</button><button id="resetBtn" class="ghost-btn">データを初期化</button></div>
      </header>

      <section class="profile-card card">
        <div>
          <h2><span id="clientName">山田 太郎</span> <span class="badge">アクティブ</span></h2>
          <p id="clientMeta">28歳 / 男性 / 178cm</p>
          <p id="clientGoal">目標：減量・筋力向上</p>
        </div>
        <div class="quick-actions">
          <button data-open="training">＋ トレーニング記録</button>
          <button data-open="body">＋ 身体・生活データ</button>
        </div>
      </section>

      <section class="kpis" id="kpiGrid"></section>

      <section class="grid two">
        <article class="card chart-card">
          <div class="card-head"><h3>体重の推移</h3><span>kg</span></div>
          <svg id="weightChart" viewBox="0 0 700 260" preserveAspectRatio="none"></svg>
        </article>
        <article class="card chart-card">
          <div class="card-head"><h3>水分摂取量の推移</h3><span>L / 日</span></div>
          <svg id="waterChart" viewBox="0 0 700 260" preserveAspectRatio="none"></svg>
        </article>
      </section>

      <section class="grid two">
        <article class="card chart-card">
          <div class="card-head"><h3>推定1RMの推移</h3><span>RPE補正</span></div>
          <svg id="ormChart" viewBox="0 0 700 260" preserveAspectRatio="none"></svg>
        </article>
        <article class="card chart-card">
          <div class="card-head"><h3>トレーニングボリューム</h3><span>重量 × 回数 × セット</span></div>
          <svg id="volumeChart" viewBox="0 0 700 260" preserveAspectRatio="none"></svg>
        </article>
      </section>

      <section class="grid two">
        <article class="card">
          <div class="card-head"><h3>最新トレーニング記録</h3></div>
          <div class="table-wrap"><table><thead><tr><th>日付</th><th>種目</th><th>重量</th><th>回数</th><th>RPE</th><th>推定1RM</th></tr></thead><tbody id="trainingTable"></tbody></table></div>
        </article>
        <article class="card">
          <div class="card-head"><h3>直近7日コンディション</h3></div>
          <div id="conditionSummary" class="condition-grid"></div>
        </article>
      </section>
    </main>
  </div>

  <dialog id="trainingDialog">
    <form id="trainingForm" method="dialog">
      <h2>トレーニングを記録</h2>
      <label>日付<input name="date" type="date" required></label>
      <label>種目<select name="exercise"><option>ベンチプレス</option><option>スクワット</option><option>デッドリフト</option><option>ショルダープレス</option><option>ラットプルダウン</option></select></label>
      <div class="form-grid"><label>重量(kg)<input name="weight" type="number" step="0.5" min="0" required></label><label>回数<input name="reps" type="number" min="1" required></label></div>
      <div class="form-grid"><label>セット<input name="sets" type="number" min="1" value="3" required></label><label>RPE<input name="rpe" type="number" step="0.5" min="5" max="10" value="8" required></label></div>
      <p class="hint">推定1RMは Epley式をベースに、RPEから残存回数(RIR)を推定して補正します。</p>
      <div class="dialog-actions"><button type="button" data-close>キャンセル</button><button class="primary" value="default">保存</button></div>
    </form>
  </dialog>

  <dialog id="bodyDialog">
    <form id="bodyForm" method="dialog">
      <h2>身体・生活データを記録</h2>
      <label>日付<input name="date" type="date" required></label>
      <div class="form-grid"><label>体重(kg)<input name="bodyWeight" type="number" step="0.1" required></label><label>体脂肪率(%)<input name="bodyFat" type="number" step="0.1"></label></div>
      <div class="form-grid"><label>水分量(L)<input name="water" type="number" step="0.1"></label><label>睡眠(時間)<input name="sleep" type="number" step="0.1"></label></div>
      <div class="form-grid"><label>歩数<input name="steps" type="number"></label><label>体調(10点)<input name="condition" type="number" min="1" max="10"></label></div>
      <div class="dialog-actions"><button type="button" data-close>キャンセル</button><button class="primary" value="default">保存</button></div>
    </form>
  </dialog>


  <dialog id="clientDialog">
    <form id="clientForm" method="dialog">
      <h2>クライアント管理</h2>
      <label>クライアント<select id="clientSelect" name="clientSelect"></select></label>
      <div class="form-grid"><label>名前<input name="name" required></label><label>年齢<input name="age" type="number" min="0"></label></div>
      <div class="form-grid"><label>性別<select name="sex"><option>男性</option><option>女性</option><option>その他</option></select></label><label>身長(cm)<input name="height" type="number" step="0.1"></label></div>
      <label>目標<input name="goal" placeholder="例：減量・筋力向上"></label>
      <div class="dialog-actions"><button type="button" id="newClientBtn">新規入力</button><button type="button" data-close>キャンセル</button><button class="primary" value="default">保存</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
